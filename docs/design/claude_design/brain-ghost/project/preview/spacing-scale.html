<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card" style="gap:10px">
  <div class="row" style="gap:8px;align-items:flex-end">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:4px;height:18px;background:var(--bg-primary-blue);border-radius:2px"></div><div class="hex">xs · 4</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:18px;background:var(--bg-primary-blue);border-radius:2px"></div><div class="hex">sm · 8</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:16px;height:18px;background:var(--bg-primary-blue);border-radius:2px"></div><div class="hex">md · 16</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:18px;background:var(--bg-primary-blue);border-radius:2px"></div><div class="hex">lg · 24</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:18px;background:var(--bg-primary-blue);border-radius:2px"></div><div class="hex">xl · 32</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:18px;background:var(--bg-primary-blue);border-radius:2px"></div><div class="hex">2xl · 48</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:18px;background:var(--bg-primary-blue);border-radius:2px"></div><div class="hex">3xl · 64</div></div>
  </div>
  <div class="caption" style="color:var(--fg3)">Strict 8pt grid. Default screen margin = lg (24). Bottom safe area = 96px for thumb reach.</div>
</body></html>
