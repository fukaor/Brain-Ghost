<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="row">
    <div class="swatch" style="flex:1 1 140px"><div class="chip" style="background:#22C55E"></div><div class="label">Win / Positive</div><div class="hex">#22C55E · victory</div></div>
    <div class="swatch" style="flex:1 1 140px"><div class="chip" style="background:#FACC15"></div><div class="label">Gold / Best</div><div class="hex">#FACC15 · achievement only</div></div>
    <div class="swatch" style="flex:1 1 140px"><div class="chip" style="background:#64748B"></div><div class="label">Loss</div><div class="hex">#64748B · NEVER red</div></div>
    <div class="swatch" style="flex:1 1 140px"><div class="chip" style="background:#3B82F6"></div><div class="label">Accent Blue</div><div class="hex">#3B82F6 · links / info</div></div>
    <div class="swatch" style="flex:1 1 140px;position:relative">
      <div class="chip" style="background:repeating-linear-gradient(45deg,#ffe6e6 0 8px,#ffd0d0 8px 16px);display:flex;align-items:center;justify-content:center">
        <span style="font-family:var(--font-family-icon);font-size:28px;color:#c62828">block</span>
      </div>
      <div class="label">No Red</div><div class="hex">禁則 — not defined</div>
    </div>
  </div>
  <div class="caption" style="color:var(--fg3)">Gold is demoted to achievement-only in v2. Loss states resolve to neutral gray; there is no RED constant in ColorPaletteUtil.</div>
</body></html>
