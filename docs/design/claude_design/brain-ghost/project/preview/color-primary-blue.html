<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="row" style="gap:14px">
    <div class="swatch" style="flex:2 1 200px"><div class="chip" style="background:#0058BA"></div><div class="label">Primary Blue</div><div class="hex">#0058BA · CTA face</div></div>
    <div class="swatch" style="flex:1 1 120px"><div class="chip" style="background:#004DA4"></div><div class="label">Primary Dim</div><div class="hex">#004DA4 · press / 3D</div></div>
    <div class="swatch" style="flex:1 1 120px"><div class="chip" style="background:#5091FF"></div><div class="label">Fixed Dim</div><div class="hex">#5091FF · hover</div></div>
    <div class="swatch" style="flex:1 1 120px"><div class="chip" style="background:#6C9FFF"></div><div class="label">Container</div><div class="hex">#6C9FFF · grad end</div></div>
    <div class="swatch" style="flex:1 1 120px"><div class="chip" style="background:#F0F2FF;box-shadow:inset 0 0 0 1px #DDE1FF, var(--shadow-card)"></div><div class="label">On-Primary</div><div class="hex">#F0F2FF · text</div></div>
  </div>
  <div class="caption" style="color:var(--fg3)">Primary blues drive CTA, active, 3D buttons. Replaces v1 gold as primary (2026-04-13).</div>
</body></html>
