<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="row" style="gap:12px">
    <div style="display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-radius:9999px;box-shadow:var(--shadow-pill)">
      <span class="icon" style="font-size:20px;color:var(--bg-gold)">local_fire_department</span>
      <span style="font-size:26px;color:var(--fg1);line-height:1">5</span>
      <span style="font-size:14px;color:var(--fg3)">日連続</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-radius:9999px;box-shadow:var(--shadow-pill)">
      <span class="icon" style="font-size:20px;color:var(--bg-gold)">psychology</span>
      <span style="font-size:26px;color:var(--fg1);line-height:1">28</span>
      <span style="font-size:14px;color:var(--fg3)">歳</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-radius:9999px;box-shadow:var(--shadow-pill)">
      <span class="icon" style="font-size:20px;color:var(--bg-gold)">target</span>
      <span style="font-size:26px;color:var(--fg1);line-height:1">67</span>
      <span style="font-size:14px;color:var(--fg3)">%</span>
    </div>
  </div>
  <div class="row" style="gap:10px">
    <div style="padding:6px 14px;background:var(--bg-gold);color:var(--fg-on-gold);border-radius:9999px;font-size:14px">ベスト更新</div>
    <div style="padding:6px 14px;background:#22C55E;color:#fff;border-radius:9999px;font-size:14px">勝利</div>
    <div style="padding:6px 14px;background:#E4E7FF;color:var(--fg1);border-radius:9999px;font-size:14px">記憶力</div>
    <div style="padding:6px 14px;background:#E2E8F0;color:var(--fg-neutral-gray);border-radius:9999px;font-size:14px">未プレイ</div>
  </div>
  <div class="caption" style="color:var(--fg3)">HUD pills top row (streak / brain age / accuracy). Achievement chips below.</div>
</body></html>
