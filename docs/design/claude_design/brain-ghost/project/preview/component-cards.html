<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div style="display:flex;gap:12px;padding:16px;background:#FFFCED;border-radius:24px;box-shadow:var(--shadow-hero),inset 0 -4px 0 var(--bg-gold);align-items:center">
    <span class="icon" style="font-size:28px;color:var(--fg1)">auto_awesome</span>
    <div style="flex:1">
      <div style="font-size:22px;color:var(--fg1);line-height:1.2">今日のチャレンジ</div>
      <div style="font-size:14px;color:var(--fg3)">3種類 / 約2分</div>
    </div>
    <button style="border:0;background:var(--bg-primary-blue);color:var(--fg-on-cta);font:inherit;font-size:18px;padding:12px 22px;border-radius:24px;box-shadow:0 3px 0 var(--bg-primary-dim)">スタート</button>
  </div>
  <div class="row" style="gap:12px">
    <div style="flex:1;display:flex;flex-direction:column;gap:6px;padding:14px;background:#fff;border-radius:16px;box-shadow:var(--shadow-card)">
      <span class="icon" style="font-size:32px;color:var(--fg1)">apps</span>
      <div style="font-size:18px;color:var(--fg1)">全ゲーム</div>
      <div style="font-size:14px;color:var(--fg3)">6種類</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px;padding:14px;background:#fff;border-radius:16px;box-shadow:var(--shadow-card)">
      <span class="icon" style="font-size:32px;color:var(--fg1)">calendar_month</span>
      <div style="font-size:18px;color:var(--fg1)">今週のハンコ</div>
      <div style="font-size:14px;color:var(--fg3)">5 / 7日</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px;padding:14px;background:#fff;border-radius:16px;box-shadow:var(--shadow-card)">
      <span class="icon" style="font-size:32px;color:var(--bg-accent-blue)">radar</span>
      <div style="font-size:18px;color:var(--fg1)">能力レーダー</div>
      <div style="font-size:14px;color:var(--fg3)">6軸</div>
    </div>
  </div>
</body></html>
