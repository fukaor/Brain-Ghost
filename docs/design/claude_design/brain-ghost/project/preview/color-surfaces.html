<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="row">
    <div class="swatch" style="flex:1 1 150px"><div class="chip" style="background:#F7F5FF;box-shadow:inset 0 0 0 1px #E4E7FF"></div><div class="label">Background</div><div class="hex">#F7F5FF · L0 canvas</div></div>
    <div class="swatch" style="flex:1 1 150px"><div class="chip" style="background:#EFEFFF"></div><div class="label">Surface Low</div><div class="hex">#EFEFFF · L1</div></div>
    <div class="swatch" style="flex:1 1 150px"><div class="chip" style="background:#FFFFFF;box-shadow:var(--shadow-card)"></div><div class="label">Surface Lowest</div><div class="hex">#FFFFFF · L2 active</div></div>
    <div class="swatch" style="flex:1 1 150px"><div class="chip" style="background:#E4E7FF"></div><div class="label">Container</div><div class="hex">#E4E7FF</div></div>
    <div class="swatch" style="flex:1 1 150px"><div class="chip" style="background:#DDE1FF"></div><div class="label">Container High</div><div class="hex">#DDE1FF</div></div>
  </div>
  <div class="caption" style="color:var(--fg3)">Depth is expressed by surface color + shadow. Borders are禁則.</div>
</body></html>
