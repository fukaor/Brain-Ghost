<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div style="display:flex;align-items:center;gap:16px;padding:16px;background:#fff;border-radius:20px;box-shadow:var(--shadow-bubble);position:relative">
    <img src="../assets/characters/ghost_seirei.png" alt="" style="width:72px;height:auto;flex:none">
    <div style="flex:1;line-height:1.4">
      <div style="font-size:18px;color:var(--fg1)">おかえり！5日連続すごいね。</div>
      <div style="font-size:16px;color:var(--fg2)">今日も一緒にがんばろう！</div>
    </div>
  </div>
  <div class="row" style="gap:16px;align-items:center">
    <img src="../assets/characters/ghost_seirei.png" style="width:56px;opacity:0.2" alt="">
    <img src="../assets/characters/ghost_seirei.png" style="width:56px;opacity:0.5" alt="">
    <img src="../assets/characters/ghost_seirei.png" style="width:56px;opacity:0.8" alt="">
    <img src="../assets/characters/ghost_seirei.png" style="width:56px;opacity:1" alt="">
    <div class="caption" style="color:var(--fg3)">opacity = accuracy (精度) — 0.2 / 0.5 / 0.8 / 1.0</div>
  </div>
</body></html>
