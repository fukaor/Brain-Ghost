<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="row" style="gap:12px">
    <div class="col" style="align-items:center;gap:4px"><div style="width:100px;height:60px;border-radius:10px;background:linear-gradient(180deg,#FFFBEA 0%,#F7F5FF 60%,#EFEFFF 100%)"></div><div class="hex">page_bg</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:100px;height:60px;border-radius:10px;background:linear-gradient(180deg,#FFFCED 0%,#FFF5D1 100%)"></div><div class="hex">hero_card_bg</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:100px;height:60px;border-radius:10px;background:linear-gradient(180deg,#0058BA 0%,#6C9FFF 100%)"></div><div class="hex">cta_blue</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:100px;height:60px;border-radius:10px;background:linear-gradient(180deg,#FACC15 0%,#E0B412 100%)"></div><div class="hex">cta_gold</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:100px;height:60px;border-radius:10px;background:linear-gradient(180deg,#fff 0%,#f7f5ff 100%);box-shadow:inset 0 0 0 1px #E4E7FF"></div><div class="hex">glass_surface</div></div>
  </div>
  <div class="caption" style="color:var(--fg3)">Pre-baked as small PNGs under <code style="font-size:12px;color:var(--fg2)">assets/textures/gradients/</code> and sampled via StyleBoxTexture in Godot.</div>
</body></html>
