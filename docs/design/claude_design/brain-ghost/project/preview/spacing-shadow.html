<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="row" style="gap:20px;align-items:flex-end">
    <div class="col" style="align-items:center;gap:6px"><div style="width:120px;height:80px;background:#fff;border-radius:16px;box-shadow:var(--shadow-card)"></div><div class="hex">card</div><div class="caption">0 2 8 · 0.08</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:120px;height:80px;background:#fff;border-radius:16px;box-shadow:var(--shadow-card-elevated)"></div><div class="hex">elevated</div><div class="caption">0 4 12 · 0.12 (1/screen)</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:120px;height:80px;background:#FFFCED;border-radius:24px;box-shadow:var(--shadow-hero),inset 0 -4px 0 var(--bg-gold)"></div><div class="hex">hero</div><div class="caption">0 6 18 · 0.22 + gold 4px</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:120px;height:44px;background:#fff;border-radius:9999px;box-shadow:var(--shadow-pill)"></div><div class="hex">pill</div><div class="caption">shadow + inset hilite</div></div>
  </div>
  <div class="caption" style="color:var(--fg3)">Pure black + alpha only. Colored shadows are禁則.</div>
</body></html>
