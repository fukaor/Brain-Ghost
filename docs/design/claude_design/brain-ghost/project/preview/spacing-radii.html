<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="row" style="gap:18px;align-items:flex-end">
    <div class="col" style="align-items:center;gap:6px"><div style="width:56px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-card)"></div><div class="hex">sm · 8</div><div class="caption">chips</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:72px;height:72px;background:#fff;border-radius:16px;box-shadow:var(--shadow-card)"></div><div class="hex">md · 16</div><div class="caption">cards</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:88px;height:88px;background:var(--bg-primary-blue);border-radius:24px;box-shadow:var(--shadow-card-elevated)"></div><div class="hex">lg · 24</div><div class="caption">CTA</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:120px;height:44px;background:#fff;border-radius:9999px;box-shadow:var(--shadow-pill);display:flex;align-items:center;justify-content:center;color:var(--fg1)">5&nbsp;日</div><div class="hex">pill · ∞</div><div class="caption">chips / counters</div></div>
  </div>
  <div class="caption" style="color:var(--fg3)">CTA is rounder than cards — the visual cue that says "tap me".</div>
</body></html>
