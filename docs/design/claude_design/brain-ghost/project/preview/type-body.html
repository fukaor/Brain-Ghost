<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card" style="gap:6px">
  <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
    <span style="font-size:24px;color:var(--fg1);line-height:1.1">今週のハンコ</span>
    <span class="caption" style="color:var(--fg3)">h2 · 24pt · section head</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
    <span style="font-size:26px;color:var(--fg1);line-height:1.1">5&nbsp;日</span>
    <span class="caption" style="color:var(--fg3)">value · 26pt · HUD pill</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
    <span style="font-size:18px;color:var(--fg2);line-height:1.5">昨日のきみに、もう一度挑んでみよう。</span>
    <span class="caption" style="color:var(--fg3)">body · 18pt</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
    <span style="font-size:14px;color:var(--fg3)">3種類 / 約2分 / 最終更新 2時間前</span>
    <span class="caption" style="color:var(--fg3)">caption · 14pt (floor)</span>
  </div>
</body></html>
