<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="card">
  <div class="row" style="gap:14px;align-items:center">
    <button style="border:0;background:var(--bg-primary-blue);color:var(--fg-on-cta);font:inherit;font-size:20px;padding:18px 36px;border-radius:24px;box-shadow:0 4px 0 var(--bg-primary-dim),var(--shadow-card-elevated);cursor:pointer">スタート</button>
    <button style="border:0;background:var(--bg-primary-dim);color:var(--fg-on-cta);font:inherit;font-size:20px;padding:20px 36px 16px;border-radius:24px;box-shadow:0 0 0 var(--bg-primary-dim),var(--shadow-card);cursor:pointer;transform:translateY(2px)">スタート<span style="font-size:12px;margin-left:8px;color:#DDE1FF">pressed</span></button>
    <button style="border:0;background:#E2E8F0;color:#94A3B8;font:inherit;font-size:20px;padding:18px 36px;border-radius:24px">続ける</button>
  </div>
  <div class="row" style="gap:14px;align-items:center">
    <button style="border:0;background:var(--bg-gold);color:var(--fg-on-gold);font:inherit;font-size:18px;padding:14px 24px;border-radius:24px;box-shadow:var(--shadow-card)">ベスト更新</button>
    <button style="border:0;background:#E4E7FF;color:var(--fg1);font:inherit;font-size:18px;padding:14px 24px;border-radius:16px">シェア</button>
    <button style="border:0;background:transparent;color:var(--bg-accent-blue);font:inherit;font-size:18px;padding:14px 8px">もどる</button>
  </div>
  <div class="caption" style="color:var(--fg3)">Primary (blue, 3D), pressed, disabled · Gold is achievement-only · Secondary, text.</div>
</body></html>
